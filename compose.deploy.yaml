# compose.deploy.yaml (DEPLOY — covers prod AND staging)
#
# Single artifact for both environments. ENVIRONMENT (required) selects which; the
# deploy recipes set it and PROJECT, every other value comes from the root `.env`.
#
# Invocation (normally through root just recipes):
#   ENVIRONMENT=prod PROJECT=relab docker compose -p relab_prod --env-file .env \
#                  -f compose.yaml -f compose.deploy.yaml up -d

# --- Reusable fragments ------------------------------------------------------
# Shipping the other containers' stdout to the central collector is opt-in: include
# compose.telemetry.yml alongside this file (the deploy recipes do this
# automatically when OTEL_EXPORTER_OTLP_ENDPOINT is set in the host's root .env). Hosts
# without it get Docker's default json-file driver — no config needed.

# Bounded json-file logging on every deploy service. Docker's json-file driver is
# unbounded by default, so a crash-looping container fills /var/lib/docker and takes
# postgres down with it. Alloy tails the same files, so rotation costs nothing.
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Above UID_MAX (60000) and below nobody, so no host useradd can hand this number
# to a person and collide with the deploy-owned data. Matches `nonroot` in
# distroless/Chainguard. Must stay in step with APP_UID in the Dockerfiles.
x-app-user: &app-user "65532:65532"

x-backend-public-origins: &backend-public-origins
  API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}
  SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:?SITE_PUBLIC_URL must be set}
  DOCS_PUBLIC_URL: ${DOCS_PUBLIC_URL:?DOCS_PUBLIC_URL must be set}

x-backend-host-overrides: &backend-host-overrides
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER must be set in root .env}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM must be set in root .env}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?EMAIL_REPLY_TO must be set in root .env}
  MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
  MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
  MICROSOFT_GRAPH_SENDER_USER: ${MICROSOFT_GRAPH_SENDER_USER:-}
  BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:?BOOTSTRAP_SUPERUSER_EMAIL must be set in root .env}

x-backend-runtime-secrets: &backend-runtime-secrets
  - database_app_password
  - database_migration_password
  - database_backup_password
  - redis_password
  - auth_token_secret
  - oauth_state_secret
  - cache_signing_secret
  - data_encryption_key
  - google_oauth_client_secret
  - github_oauth_client_secret
  - smtp_password
  - microsoft_graph_client_secret
  - bootstrap_superuser_password

services:
  api:
    image: relab-backend:${ENVIRONMENT}-local
    logging: *json-logging
    read_only: true
    user: *app-user
    # NOTE: sized against the documented ~20 GiB host budget, alongside postgres
    # 4g + clamav 4g + redis 1g. Image processing is the spiky consumer here;
    # without a cap one resize burst takes the host down instead of the API.
    # Raise it if real usage shows pressure.
    mem_limit: 6g
    secrets: *backend-runtime-secrets
    tmpfs:
      - /tmp:mode=1777
    environment:
      !!merge <<: [*backend-public-origins, *backend-host-overrides]
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
      # Trust forwarded headers only from Docker-internal proxy addresses.
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
      # Complex settings types are JSON-decoded by pydantic-settings; a bare
      # string fails to parse and the container never starts.
      TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
      # OpenTelemetry — OTEL_EXPORTER_OTLP_ENDPOINT is the on/off switch;
      # leave unset in root .env to disable. OTEL_SERVICE_NAME is read by the
      # OTEL SDK automatically from the container env and matches the compose
      # service name so traces group cleanly in the backend.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Derived from one operator input, in the SDK's percent-encoded header format.
      # Alloy reads the same OTLP_AUTH_TOKEN raw. The edge key is the second header the
      # Cloudflare WAF-skip rule matches. Both must be set together with the endpoint;
      # `just deploy-secrets-check` enforces the pairing, because the SDK swallows a 401
      # and telemetry then vanishes silently.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${OTLP_AUTH_TOKEN:-},X-Telemetry-Key=${TELEMETRY_EDGE_KEY:-}
      # Pinned rather than left to the SDK default: the collector is reached through
      # a Cloudflare tunnel, which routes HTTPS to the HTTP receiver only. There is no
      # public gRPC path, so a dependency change that flipped the default protocol
      # would silently stop all telemetry.
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: relab-api
      # The other identity labels the central stack keys alerts and dashboards on.
      # Alloy stamps project/env on everything IT ships, but the SDK's own traces and
      # metrics bypass Alloy entirely, so without this they arrive attributable to no
      # project and ProjectTelemetrySilent cannot see them. The SDK reads this variable
      # itself and merges it into every Resource — no code involved. host.name is
      # absent: the API is a service-level signal and Alloy owns host identity, per
      # the producer rule in ADR 0002.
      OTEL_RESOURCE_ATTRIBUTES: project=${PROJECT},env=${ENVIRONMENT}
      # Stable HTTP semantic conventions. The legacy metrics label every series with
      # http_target, the RAW request path, so one API with path parameters mints an
      # unbounded number of series. The stable names carry http_route, the templated
      # path, which is bounded by the route table. This is ADR 0002's cardinality rule
      # (ids belong in span attributes, never labels), and what the central Service
      # Health dashboard queries.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      # ── Resource knobs ──────────────────────────────────────────────────────────
      # WEB_CONCURRENCY = Uvicorn worker processes (~1 CPU core each).
      # All other values are per worker; totals = WEB_CONCURRENCY x per-worker value.
      # The deploy default is source-controlled: edit this file when host capacity
      # changes.
      #
      #                    per worker  x  workers  =  total (prod)
      # Image threads:          5      x     4     =   20  (CPU-bound)
      # DB connections:     3 + 10     x     4     =   52  (configured postgres max_connections=100 below)
      # Outbound HTTP:        100      x     4     =  400  (mostly idle)
      WEB_CONCURRENCY: "4"
      IMAGE_RESIZE_WORKERS: "5"
      # Measured 2026-09-06: 0.26 req/s peak at 5 ms p99 never touched overflow;
      # 3 base per worker is still ~1000x that, and the pool lets bursts overflow.
      DB_POOL_SIZE: "3"
      DB_POOL_MAX_OVERFLOW: "10"
      UVICORN_LIMIT_CONCURRENCY: "100"
      # Upload ceilings. Raise these from the root .env on an instance whose
      # existing corpus already exceeds a default (the quota ledger counts real
      # rows, so an over-limit owner is blocked from uploading entirely).
      MAX_UPLOAD_FILES_PER_USER: "${MAX_UPLOAD_FILES_PER_USER:-5000}"
      MAX_UPLOAD_BYTES_PER_USER_MB: "${MAX_UPLOAD_BYTES_PER_USER_MB:-2048}"
      MAX_UPLOAD_FILES_PER_LAB_USER: "${MAX_UPLOAD_FILES_PER_LAB_USER:-20000}"
      MAX_UPLOAD_BYTES_PER_LAB_USER_MB: "${MAX_UPLOAD_BYTES_PER_LAB_USER_MB:-20480}"
      # deploy_ops.sh adds the `scanning` profile below whenever this is not false;
      # true without a running clamav fails uploads closed.
      MALWARE_SCAN_ENABLED: "${MALWARE_SCAN_ENABLED:-true}"
      CLAMAV_HOST: clamav
    depends_on:
      clamav:
        condition: service_healthy
        # Optional so the stack still starts when the `scanning` profile is off.
        required: false
      migrator:
        # Bring the stack up with the `migrations` profile and the API waits for
        # the schema instead of racing it. Optional for the same reason as clamav:
        # migrator sits behind that profile (compose.yaml), and without this the
        # default profile-less `up` would refuse to start at all.
        #
        # This does NOT cover `just stack prod migrate`, which runs the migrator on its
        # own against an already-serving API — see deploy/DEPLOY-PROD.md for when each
        # is appropriate.
        condition: service_completed_successfully
        required: false
    networks:
      - scanning

  clamav:
    # Gated behind the `scanning` profile: it needs 3-4 GiB of RAM, which not
    # every host can spare, and the first start with an empty clamav_db volume
    # downloads signatures before clamd becomes healthy, so API startup waits
    # several minutes. Omit the profile only together with
    # MALWARE_SCAN_ENABLED=false, and treat that as an accepted risk.
    profiles:
      - scanning
    image: clamav/clamav:1.5.4_base-debian@sha256:2bc2f9c5c1fd5120a334490d005c694430f0589d085a7aca400bbd93458fe1f0
    logging: *json-logging
    entrypoint: /init-unprivileged
    user: clamav
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 3g
    cap_drop:
      - ALL
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 2>/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 10s
      retries: 3
    networks:
      - scanning

  migrator:
    image: relab-backend-migrations:${ENVIRONMENT}-local
    logging: *json-logging
    read_only: true
    user: *app-user
    secrets: *backend-runtime-secrets
    environment:
      !!merge <<: [*backend-public-origins, *backend-host-overrides]
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
    tmpfs:
      - /tmp:mode=1777

  backup:
    # Encrypted logical PostgreSQL + user upload backups.
    build:
      context: ./backend
      dockerfile: Dockerfile.backups
    image: relab-backup:${ENVIRONMENT}-local
    logging: *json-logging
    cap_drop:
      - ALL
    pids_limit: 512
    read_only: true
    # One-shot: the systemd timer runs this via `compose run`, never `up`.
    restart: "no"
    # Without this each `compose run` container gets a fresh random hostname, and
    # restic picks its parent snapshot by (host, paths) — so every run would re-read
    # and re-hash all of /data/uploads instead of taking the metadata shortcut.
    hostname: relab-backup
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    user: *app-user
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - user_uploads:/data/uploads:ro
      # A short-syntax bind lets Docker create a missing source directory, so a backup
      # disk that failed to mount would get an empty one invented under it and the run
      # would back up into nothing. create_host_path: false fails the run instead, and
      # it needs this longer syntax.
      - type: bind
        source: ${BACKUP_HOST_DIR:-./backups}/restic
        target: /restic
        bind:
          create_host_path: false
      # restic's cache must outlive the container: this is a one-shot with --rm, so
      # a cache on the tmpfs below would be cold every run and re-download the whole
      # offsite index over WebDAV nightly.
      - restic_cache:/var/cache/restic
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: relab_db
      DATABASE_BACKUP_USER: relab_backup
      DATABASE_BACKUP_PASSWORD_FILE: /run/secrets/database_backup_password
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_REPOSITORY: /restic
      RESTIC_CACHE_DIR: /var/cache/restic
      # Lets the run assert the uploads volume is this environment's, not another
      # stack's after a mistyped -p. Compared against .relab-volume inside the volume.
      RELAB_ENVIRONMENT: ${ENVIRONMENT:?}
      XDG_CACHE_HOME: /tmp/xdg-cache
      UPLOADS_DIR: /data/uploads
      BACKUP_WORK_DIR: /tmp/relab-backups
      # restic counts distinct HOURS that contain a snapshot, so this is only
      # meaningful with hourly backups (relab-backup@.timer): under daily backups 24
      # would resolve to 24 distinct DAYS and override the 14 below. 24 keeps one day
      # of hourly granularity; compressed pg_dumps deduplicate poorly, so every extra
      # hour is a near-full copy.
      RESTIC_KEEP_HOURLY: "24"
      RESTIC_KEEP_DAILY: "14"
      RESTIC_KEEP_WEEKLY: "8"
      RESTIC_KEEP_MONTHLY: "12"
      # Offsite copy, run at the end of the DAILY maintenance cycle (the hourly
      # snapshot runs skip it), to the one remote in rclone.conf
      # (derive_offsite_repository); the offsite repo reuses restic_password. A
      # placeholder config means the only copy of the backups lives on the same
      # host disk as the data.
      RCLONE_CONFIG: /run/secrets/rclone.conf
    secrets:
      - database_backup_password
      - restic_password
      - rclone.conf
    profiles:
      - backups
    tmpfs:
      - /tmp:mode=1777
    networks:
      # `data` is internal (no gateway), so a container on it alone cannot resolve or
      # reach the offsite remote. `egress` gives the backup container a way out
      # without the lateral access to web services that `edge` would grant. Postgres
      # and the rest stay on `data` only.
      - data
      - egress

  redis:
    logging: *json-logging
    secrets:
      - redis_password
    volumes:
      # Persist cache data in both prod and staging (AOF persistence).
      - cache_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
    # This command replaces the base one wholesale, so it must repeat every flag
    # from compose.yaml's redis command — NOTE: keep the two in sync. The memory
    # bounds are not optional here: Redis holds refresh-token blacklists, so
    # eviction would re-admit revoked tokens (see the base command's comment).
    command:
      - sh
      - -c
      - |
        redis_password="$$(cat /run/secrets/redis_password)"
        exec redis-server --appendonly yes --save 60 1 --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$redis_password"

  cloudflared:
    # Cloudflared tunnel service
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    logging: *json-logging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      # The tunnel fronts four hostnames; starting it before the frontends are
      # up serves 502s on three of them for the length of every deploy. They
      # have no healthcheck, so `service_started` is as strict as it gets.
      docs:
        condition: service_started
      app:
        condition: service_started
      www:
        condition: service_started
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set (in root .env on the deploy host)}
    command: tunnel --no-autoupdate run
    pull_policy: always
    # The one service neither hardening anchor in compose.yaml covers, because it is
    # defined only here. The image already runs as 65532; a tunnel dials out over
    # TCP/QUIC and binds nothing, so it needs no capabilities.
    # NOTE: dropping ALL also disables cloudflared's ICMP proxy, which wants NET_RAW.
    # That path only serves WARP-to-tunnel ping; the hostnames here are HTTP, and the
    # daemon logs one line about it at startup rather than failing.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    networks:
      - edge

  postgres:
    logging: *json-logging
    # Compose replaces `command` instead of appending to it, so this repeats the
    # base tuning from compose.yaml verbatim — NOTE: keep the two in sync. Only
    # max_connections differs: the API alone can reach 52 (4 workers x pool 3 +
    # overflow 10), and 100 leaves margin for migrator, backup and operator psql.
    # NOTE: work_mem is per sort, so 100 busy connections could in theory outrun
    # mem_limit; the real ceiling is the 52-connection app pool, mostly idle.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2560MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - track_io_timing=on
      - -c
      - jit=off
    environment:
      # An existing cluster may have no `postgres` role at all (staging does
      # not); the healthcheck runs `pg_isready -U $POSTGRES_USER`, so a mismatch
      # here leaves the service permanently unhealthy. See deploy/DEPLOY-PROD.md.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_DB: relab_db
      DATABASE_APP_USER: relab_app
      DATABASE_MIGRATION_USER: relab_migrator
      DATABASE_BACKUP_USER: relab_backup
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_APP_PASSWORD_FILE: /run/secrets/database_app_password
      DATABASE_MIGRATION_PASSWORD_FILE: /run/secrets/database_migration_password
      DATABASE_BACKUP_PASSWORD_FILE: /run/secrets/database_backup_password
    secrets:
      - postgres_password
      - database_app_password
      - database_migration_password
      - database_backup_password

  docs:
    image: relab-docs:${ENVIRONMENT}-local
    logging: *json-logging
    read_only: true
    user: *app-user
    build:
      args:
        ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
        PUBLIC_DOCS_URL: ${DOCS_PUBLIC_URL:?DOCS_PUBLIC_URL must be set}
        PUBLIC_BACKEND_API_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
    environment:
      # Needed by Caddyfile so API reference pages can fetch live OpenAPI JSON.
      CADDY_API_ORIGIN: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
    tmpfs:
      - /config:uid=65532,gid=65532
      - /data:uid=65532,gid=65532
      - /tmp:mode=1777

  app:
    image: relab-app:${ENVIRONMENT}-local
    logging: *json-logging
    read_only: true
    user: *app-user
    build:
      args:
        ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
        EXPO_PUBLIC_API_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
        EXPO_PUBLIC_WEBSITE_URL: ${SITE_PUBLIC_URL:?SITE_PUBLIC_URL must be set}
        EXPO_PUBLIC_DOCS_URL: ${DOCS_PUBLIC_URL:?DOCS_PUBLIC_URL must be set}
    environment:
      # Needed by Caddyfile to determine the API origin.
      CADDY_API_ORIGIN: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
    tmpfs:
      - /config:uid=65532,gid=65532
      - /data:uid=65532,gid=65532
      - /tmp:mode=1777

  www:
    image: relab-www:${ENVIRONMENT}-local
    logging: *json-logging
    read_only: true
    user: *app-user
    build:
      args:
        ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
        PUBLIC_APP_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}
        PUBLIC_DOCS_URL: ${DOCS_PUBLIC_URL:?DOCS_PUBLIC_URL must be set}
        PUBLIC_SITE_URL: ${SITE_PUBLIC_URL:?SITE_PUBLIC_URL must be set}
        PUBLIC_API_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
        # Optional: the landing hero falls back to the committed fixture when unset.
        PUBLIC_FEATURED_PRODUCT_ID: ${FEATURED_PRODUCT_ID:-}
    environment:
      # Needed by Caddyfile to allow the homepage stats fetch in the CSP.
      CADDY_API_ORIGIN: ${API_PUBLIC_URL:?API_PUBLIC_URL must be set}
    tmpfs:
      - /config:uid=65532,gid=65532
      - /data:uid=65532,gid=65532
      - /tmp:mode=1777

volumes:
  restic_cache:
  cache_data:
  clamav_db:

secrets:
  postgres_password:
    file: ./secrets/${ENVIRONMENT}/postgres_password
  database_app_password:
    file: ./secrets/${ENVIRONMENT}/database_app_password
  database_migration_password:
    file: ./secrets/${ENVIRONMENT}/database_migration_password
  database_backup_password:
    file: ./secrets/${ENVIRONMENT}/database_backup_password
  redis_password:
    file: ./secrets/${ENVIRONMENT}/redis_password
  restic_password:
    file: ./secrets/${ENVIRONMENT}/restic_password
  # Its one remote is the offsite target; same path the manual
  # `just backup-offsite-copy` helper expects.
  rclone.conf:
    file: ./secrets/${ENVIRONMENT}/rclone.conf
  auth_token_secret:
    file: ./secrets/${ENVIRONMENT}/auth_token_secret
  oauth_state_secret:
    file: ./secrets/${ENVIRONMENT}/oauth_state_secret
  cache_signing_secret:
    file: ./secrets/${ENVIRONMENT}/cache_signing_secret
  data_encryption_key:
    file: ./secrets/${ENVIRONMENT}/data_encryption_key
  google_oauth_client_secret:
    file: ./secrets/${ENVIRONMENT}/google_oauth_client_secret
  github_oauth_client_secret:
    file: ./secrets/${ENVIRONMENT}/github_oauth_client_secret
  smtp_password:
    file: ./secrets/${ENVIRONMENT}/smtp_password
  microsoft_graph_client_secret:
    file: ./secrets/${ENVIRONMENT}/microsoft_graph_client_secret
  bootstrap_superuser_password:
    file: ./secrets/${ENVIRONMENT}/bootstrap_superuser_password

networks:
  scanning:
  # Outbound-only network for services that push to external endpoints: the backup
  # container's offsite copy, plus — when their overlays are included — the Alloy
  # agent and the GPU exporter (compose.telemetry.yml, compose.telemetry.gpu.yml).
  egress:
