- main:
  - heading "Privacy policy" [level=1]
  - paragraph: "/Last updated: May 6, \\d+/"
  - paragraph: This policy explains what we collect, why we use it, and what choices you have.
  - article:
    - heading "Account information" [level=2]
    - paragraph: When you create an account, we ask for a username, email address, and password. We store passwords only in protected hashed form. We use your email to help you sign in and to send important service messages. We record when you log in successfully, but we do not keep full login IP addresses on your account.
    - paragraph: If you connect Google, GitHub, or YouTube, RELab stores the connection details encrypted. You can use Sign out everywhere in your profile to end active sessions for your account on other devices.
  - article:
    - heading "Contributions" [level=2]
    - paragraph: Your profile and contribution statistics are public by default. You can change your profile to community-only or private in your profile settings. This changes who can see your profile details, statistics, and owner name. It does not make uploaded product records, files, images, or videos private.
    - paragraph: Product records, files, and images you upload may be public so the research dataset can be reused. We store uploads on our servers and include them in backups. We use them to show your contributions in RELab and for research when you choose to contribute.
    - paragraph: External videos load only after you choose to load them.
    - paragraph: You can delete your products and uploaded images in the app. If you need help, contact us and we will remove the related uploads and records.
  - article:
    - heading "AI and research use" [level=2]
    - paragraph: We may use research contributions after removing direct account identifiers. We do not use your email, username, or password to train models.
  - article:
    - heading "Your rights" [level=2]
    - paragraph:
      - strong: "Updates:"
      - text: Project updates may be shared on GitHub and LinkedIn. Optional account update emails follow your account preferences.
    - paragraph:
      - strong: "Account holders:"
      - text: You can view and update your account details, and you can ask us to delete your account and related data.
    - paragraph:
      - strong: "Contact:"
      - link "relab@cml.leidenuniv.nl":
        - /url: mailto:relab@cml.leidenuniv.nl
      - text: for questions or data requests.
