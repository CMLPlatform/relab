# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` on top of the default types: CodeQL skips drafts, so
    # marking a PR ready must trigger the run that fills it in.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  # Keyed by event so a scheduled run and a push run on the same ref never share
  # a group; within a group, newer commits supersede older runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changed Areas
    # Pull requests run only the subrepo jobs their diff reaches; push, schedule,
    # and manual runs run everything. See scripts/ci_changed_areas.py.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      www: ${{ steps.areas.outputs.www }}
      docs: ${{ steps.areas.outputs.docs }}
      web: ${{ steps.areas.outputs.web }}
      smoke: ${{ steps.areas.outputs.smoke }}
      codeql: ${{ steps.areas.outputs.codeql }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The PR merge commit and its first parent (the base) are enough to diff.
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        # An empty diff runs everything; a failed one fails this job and CI Result.
        run: git diff --name-only HEAD^1 HEAD | python3 scripts/ci_changed_areas.py "$EVENT" | tee -a "$GITHUB_OUTPUT"

  automation:
    name: Root, IaC, and Compose Policy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-python: "true"
          setup-node: "true"
          uv-cache-dependency-glob: |
            pyproject.toml
            uv.lock
            backend/uv.lock

      - name: Compute prek cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache prek environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/prek
          key: prek|${{ runner.os }}|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install root dependencies
        run: uv sync --frozen && pnpm install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Run repository policy hooks
        run: just pre-commit
        env:
          # CI runs on a detached ref, where the local-only branch guard does nothing.
          SKIP: no-commit-to-branch

      - name: Run root quality gate
        run: just check-root

      - name: Run root script tests
        run: just test-scripts

      - name: Run env, Compose, and deploy-secret checks
        run: just policy-check

      - name: Validate Cloudflare IaC
        run: just cloudflare-check

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-python: "true"
          uv-cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: just backend/install

      - name: Run check
        run: just backend/check

      - name: Run CI test suite
        run: just backend/test-ci
        env:
          # The factories seed themselves from TEST_SEED so a run is reproducible.
          # The weekly scheduled run rotates the seed to surface tests that only
          # pass under seed 0; run_id (not $RANDOM) so TEST_SEED=<id> reproduces
          # the failure.
          TEST_SEED: ${{ github.event_name == 'schedule' && github.run_id || '0' }}

      - name: Publish reports
        uses: ./.github/actions/publish-reports
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          coverage-file: ./backend/reports/coverage/coverage.xml
          junit-file: ./backend/reports/junit.xml
          network-prefix: backend/app/
          artifact-path: |
            backend/reports/coverage/html/
            backend/reports/coverage/coverage.xml

  web:
    name: ${{ matrix.subrepo }}
    needs: changes
    if: needs.changes.outputs.web != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        subrepo: ${{ fromJSON(needs.changes.outputs.web) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"

      - name: Install dependencies
        run: just ${{ matrix.subrepo }}/install

      - name: Run check
        run: just ${{ matrix.subrepo }}/check

      - name: Run CI test suite
        run: just ${{ matrix.subrepo }}/test-ci
        env:
          # App coverage is the critical path of a PR run (see app/justfile).
          COVERAGE: ${{ (matrix.subrepo != 'app' || github.event_name != 'pull_request') && 'true' || '' }}

      - name: Publish reports
        uses: ./.github/actions/publish-reports
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.subrepo }}
          coverage-file: ./${{ matrix.subrepo }}/coverage/lcov.info
          junit-file: ./${{ matrix.subrepo }}/junit.xml
          network-prefix: ${{ matrix.subrepo }}/
          artifact-path: ${{ matrix.subrepo }}/coverage/

  e2e-www:
    name: www E2E
    needs: changes
    if: needs.changes.outputs.www == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          setup-playwright: "true"

      - name: Install dependencies
        run: just www/install

      # The recipe builds the site and installs chromium before running the suite.
      - name: Run browser E2E tests
        run: just www/test-e2e

      - name: Archive Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-www-playwright
          path: www/playwright-report/
          retention-days: 7

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          setup-playwright: "true"

      - name: Install dependencies
        run: just docs/install

      - name: Run docs check
        run: just docs/check

      # The recipe installs chromium before running the suite.
      - name: Run docs CI test suite
        run: just docs/test-ci

  e2e-full-stack:
    name: App Full-Stack E2E
    # Needs the full Docker backend, so it runs post-merge, weekly, or on demand
    # rather than on every PR (see CONTRIBUTING.md).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          setup-playwright: "true"

      - name: Install app dependencies
        run: just app/install

      # The recipe builds the Expo web app and installs chromium before running the suites.
      - name: Run full-stack E2E tests
        run: just test-e2e-full-stack

      - name: Archive Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-app-e2e
          path: app/playwright-report/
          retention-days: 7

  docker-smoke:
    name: Docker Smoke (${{ matrix.recipe }})
    needs: changes
    if: needs.changes.outputs.smoke != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.changes.outputs.smoke) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # compose.yaml declares `cache_from/cache_to: type=gha`, but that backend
      # needs ACTIONS_RUNTIME_TOKEN / ACTIONS_RESULTS_URL, which the runner only
      # hands to JavaScript actions — buildx invoked from a shell step never sees
      # them, so the cache silently no-ops without this.
      - name: Expose GitHub Actions runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Run smoke recipe
        env:
          RECIPE: ${{ matrix.recipe }}
          # Route builds through bake, whose buildx integration honours the
          # compose cache_from/cache_to entries. CI-only: local runs are unchanged.
          COMPOSE_BAKE: "true"
          # Only pushes to main write the full layer cache the app image's `mode=max`
          # export costs ~57s to produce; see the comment on `app.build.cache_to` in
          # compose.yaml.
          BUILDKIT_APP_CACHE_MODE: ${{ github.event_name == 'pull_request' && 'min' || 'max' }}
        run: |-
          read -ra recipe <<<"$RECIPE"
          just "${recipe[@]}"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873 # v1.3.2
        with:
          version: 8.30.1
        env:
          GITLEAKS_CONFIG: .github/gitleaks.toml

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Every entry here needs a reachable-but-unfixable justification and a
          # condition for removing it, and a matching ignoreGhsas entry in
          # pnpm-workspace.yaml so `just audit` enforces the same policy.
          # Re-check the whole list when expo or metro moves a major version.
          #
          # GHSA-vcc3-ghjq-m6fr: decode-uri-component 0.2.2 arrives through
          # query-string@7, which expo-router depends on -- 57.0.17, the latest, still
          # pins ^7.1.3, so there is no version of the app's own tree that avoids it.
          # The patched 0.5.0 is ESM-only and query-string@7 requires it through CJS,
          # so overriding it breaks routing at runtime. Impact is bounded: a malformed
          # deep link can stall the JS thread of the app that opened it, which costs
          # that one user a force-quit and reaches no server and no other user. Drop
          # when expo-router moves to query-string@8+ or query-string@7 backports.
          allow-ghsas: GHSA-vcc3-ghjq-m6fr

  audit:
    name: Dependency Audit
    # Advisories surface on push and the weekly schedule; PRs get dependency-review.
    # The audits read lockfiles only, so nothing is installed beyond the toolchains.
    # Known-unfixable advisories are allow-listed in pnpm-workspace.yaml
    # (ignoreGhsas), mirroring dependency-review's allow-ghsas.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-python: "true"
          setup-node: "true"
          uv-cache-dependency-glob: |
            uv.lock
            backend/uv.lock

      - name: Run dependency audits
        run: just audit

      # Weekly only: a stale override is upstream news, not a fault in the
      # commit being pushed, so it should not fail push runs.
      - name: Flag stale security overrides
        if: github.event_name == 'schedule'
        run: just overrides-check

  container-security:
    name: Container Security
    # Post-merge, weekly, and on demand. Docker smoke already proves the same
    # Dockerfiles build on every PR, and dependency-review gates new vulnerable
    # packages there. Advisories against base images land faster than upstream
    # rebuilds them, so a finding after a merge is upstream news, not a fault in
    # that commit: push runs report it without failing, and the weekly and manual
    # runs fail on it.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/container-images.yml
    with:
      mode: scan
      blocking: ${{ github.event_name != 'push' }}

  trivy-iac:
    name: Trivy IaC
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan IaC with Trivy
        uses: docker://aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        with:
          args: >-
            config . --format sarif --output trivy-iac.sarif --exit-code 1 --severity HIGH,CRITICAL --ignorefile .github/trivyignore.yaml --skip-dirs .venv,backend/.venv,node_modules,app/node_modules,docs/node_modules,www/node_modules #magic___^_^___line
      - name: Upload Trivy IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-iac.sarif

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Skipped on drafts; `ready_for_review` fills it in.
    needs: changes
    if: >-
      needs.changes.outputs.codeql != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` complements actionlint + zizmor with dataflow-based workflow queries.
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # Code scanning stores but does not act on the suppression data that the
      # AlertSuppression queries (see codeql-config.yml) emit for in-code
      # `# lgtm[query-id]` comments; this official action closes the loop by
      # dismissing the matching alerts. Suppressions stay reviewable in diffs.
      # Default branch only: dismissal is a global alert property, and the action reads
      # default-branch alerts only.
      - name: Dismiss alerts suppressed in code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci-result:
    name: CI Result
    # Single branch-protection context: the `needs:` list is the one home of the
    # blocking job set. Skipped jobs are accepted; failed/cancelled ones fail.
    # `changes` is listed so a failed classification cannot pass as all-skipped.
    if: always()
    needs:
      - changes
      - automation
      - backend
      - web
      - e2e-www
      - docs
      - e2e-full-stack
      - docker-smoke
      - secret-scan
      - dependency-review
      - audit
      - container-security
      - trivy-iac
      - codeql
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check job results
        run: |-
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e '[.[].result] | all(. == "success" or . == "skipped")' <<<"$RESULTS" >/dev/null
