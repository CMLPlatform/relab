# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Container Images

# Builds every runtime image with placeholder URLs, scans it with Trivy (blocking
# unless `blocking: false`) and keeps a working-copy SBOM. ci.yml calls it; the
# images that deploy are built by publish-images.yml.
# Permissions come from the calling job.
on:
  workflow_call:
    inputs:
      blocking:
        description: Fail the job on a HIGH or CRITICAL finding.
        required: false
        type: boolean
        default: true

jobs:
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: r9lab-backend
          - service: migrator
            context: ./backend
            dockerfile: ./backend/Dockerfile.migrations
            image: r9lab-backend-migrations
          - service: r9lab-backup
            context: ./backend
            dockerfile: ./backend/Dockerfile.backups
            image: r9lab-backup
          - service: app
            context: .
            dockerfile: ./app/Dockerfile
            image: r9lab-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          # Fresh base images so the scan sees current CVEs.
          pull: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          # `scan-` prefix: the placeholder build-args make these layers distinct from
          # the docker-smoke builds, which write the compose `scope=<service>` caches.
          # One shared scope thrashes both. publish-images.yml reads it to start warm.
          cache-from: type=gha,scope=scan-${{ matrix.service }}
          cache-to: type=gha,scope=scan-${{ matrix.service }},mode=max
          # The www/app builds require their public URLs. These images are only
          # scanned, never deployed, so placeholders are fine; unused args on the
          # other services are ignored.
          build-args: |
            PUBLIC_APP_URL=https://app.example.invalid
            PUBLIC_DOCS_URL=https://docs.example.invalid
            PUBLIC_SITE_URL=https://example.invalid
            PUBLIC_API_URL=https://api.example.invalid
            EXPO_PUBLIC_API_URL=https://api.example.invalid
            EXPO_PUBLIC_WEBSITE_URL=https://example.invalid
            EXPO_PUBLIC_DOCS_URL=https://docs.example.invalid

      # Suppressions live in .github/trivyignore.yaml, each with an expiry and a
      # reachability note.
      - name: Scan image with Trivy
        # A non-blocking scan still marks this step failed in the run view.
        continue-on-error: ${{ !inputs.blocking }}
        uses: docker://aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        with:
          args: >-
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
            --ignorefile .github/trivyignore.yaml
            ${{ matrix.image }}:${{ github.sha }}

      - name: Generate SPDX SBOM
        uses: docker://aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        with:
          args: >-
            image --format spdx-json --output sbom-${{ matrix.service }}.spdx.json
            ${{ matrix.image }}:${{ github.sha }}

      # Working copies only; the durable SBOMs are attached to GitHub releases.
      - name: Archive container security artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ matrix.service }}-artifacts
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 7
