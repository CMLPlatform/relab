# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Sites

# Builds www and docs and deploys them to Cloudflare Workers static assets. The
# Worker names, public URLs and account come from the variables infra/cloudflare
# writes into each GitHub Environment; the API token is an Environment secret.
#
# Each deploy uploads a new version, checks its headers, 404 page and TRACE handling
# on the version's own workers.dev URL, and only then sends traffic to it.
#
# - release.yml calls this with the release tag: both environments get the release.
# - Weekly, both environments are rebuilt from the latest release, so the www hero
#   picks up a changed featured product or a changed teardown without a release.
# - A manual run deploys the selected commit to one environment. Prod's Environment
#   accepts `main` only.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to deploy.
        required: true
        type: string
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the selected commit to.
        required: true
        type: choice
        options: [staging, prod]

permissions: {}

jobs:
  resolve:
    name: Resolve ref
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      environments: ${{ steps.ref.outputs.environments }}
    steps:
      - name: Resolve ref and environments
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$TAG_NAME" ]]; then
            ref="$TAG_NAME"
          elif [[ "$EVENT" == schedule ]]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            # NOTE: releases cut before the sites moved to Workers have nothing to
            # deploy. Drop this once a release contains www/wrangler.jsonc.
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/www/wrangler.jsonc?ref=$ref" --silent 2>/dev/null; then
              echo "::notice::$ref predates the Workers deploy; nothing to rebuild."
              ref=""
            fi
          else
            ref="$GITHUB_SHA"
          fi
          if [[ -n "$ENVIRONMENT" ]]; then
            environments="[\"$ENVIRONMENT\"]"
          else
            environments='["prod","staging"]'
          fi
          {
            echo "ref=$ref"
            echo "environments=$environments"
          } >>"$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.site }} (${{ matrix.env }})
    needs: resolve
    if: needs.resolve.outputs.ref != ''
    runs-on: ubuntu-26.04
    # Per Worker, not per workflow: called from release.yml, `github.workflow` is the
    # caller's name, so a workflow-level group would not serialize a release deploy
    # with a weekly or manual one.
    concurrency:
      group: deploy-sites-${{ matrix.env }}-${{ matrix.site }}
      cancel-in-progress: false
    timeout-minutes: 20
    environment: ${{ matrix.env }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        site: [www, docs]
        env: ${{ fromJSON(needs.resolve.outputs.environments) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Check environment
        env:
          SITE: ${{ matrix.site }}
          ENV_NAME: ${{ matrix.env }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL }}
          DOCS_PUBLIC_URL: ${{ vars.DOCS_PUBLIC_URL }}
          WORKER: ${{ matrix.site == 'www' && vars.WWW_WORKER || vars.DOCS_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=()
          for name in API_PUBLIC_URL APP_PUBLIC_URL SITE_PUBLIC_URL DOCS_PUBLIC_URL; do
            [[ "${!name}" == https://* ]] || missing+=("$name (an https:// URL)")
          done
          [[ -n "$WORKER" ]] || missing+=("${SITE^^}_WORKER")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ "$HAS_TOKEN" == true ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          if ((${#missing[@]})); then
            printf 'the %s GitHub Environment is missing: %s\n' "$ENV_NAME" "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"

      - name: Install dependencies
        run: just ${{ matrix.site }}/install

      - name: Build www
        if: matrix.site == 'www'
        working-directory: www
        env:
          PUBLIC_APP_URL: ${{ vars.APP_PUBLIC_URL }}
          PUBLIC_DOCS_URL: ${{ vars.DOCS_PUBLIC_URL }}
          PUBLIC_SITE_URL: ${{ vars.SITE_PUBLIC_URL }}
          PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL }}
          PUBLIC_FEATURED_PRODUCT_ID: ${{ vars.FEATURED_PRODUCT_ID }}
          # Fail rather than ship the fixture when the featured product is unreachable.
          LANDING_REQUIRE_LIVE: "1"
        run: pnpm run build

      - name: Build docs
        if: matrix.site == 'docs'
        working-directory: docs
        env:
          ENV_NAME: ${{ matrix.env }}
          PUBLIC_DOCS_URL: ${{ vars.DOCS_PUBLIC_URL }}
          PUBLIC_BACKEND_API_URL: ${{ vars.API_PUBLIC_URL }}
        run: pnpm run "build:$ENV_NAME"

      - name: Check the built site under workerd
        working-directory: ${{ matrix.site }}
        run: ../scripts/check_site_headers.sh

      # A new Worker has no version to build on, and only `wrangler deploy` turns its
      # version URLs on (`preview_urls` in wrangler.jsonc). It has no hostname until
      # the infra/cloudflare apply, so this one unchecked deploy serves nobody.
      - name: Create the Worker if it is new
        working-directory: ${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ matrix.site == 'www' && vars.WWW_WORKER || vars.DOCS_WORKER }}
          REF: ${{ needs.resolve.outputs.ref }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/settings")"
          case "$status" in
            200) ;;
            404) pnpm exec wrangler deploy --name "$WORKER" --message "$REF (first deploy)" ;;
            *)
              echo "could not tell whether Worker $WORKER exists (HTTP $status)" >&2
              exit 1
              ;;
          esac

      - name: Upload a version
        id: upload
        working-directory: ${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ matrix.site == 'www' && vars.WWW_WORKER || vars.DOCS_WORKER }}
          REF: ${{ needs.resolve.outputs.ref }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler versions upload --name "$WORKER" --message "$REF"
          jq -rs 'map(select(.type == "version-upload")) | last
            | "version_id=\(.version_id)", "preview_url=\(.preview_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >>"$GITHUB_OUTPUT"

      # On the version's own workers.dev URL, before it takes traffic. The public
      # hostnames sit behind the zone's Bot Fight Mode, which challenges a runner,
      # and a challenge page sends a CSP of its own; workers.dev is outside the zone.
      - name: Check the version
        env:
          URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          if [[ -z "$URL" ]]; then
            echo "wrangler reported no version URL; the Worker needs preview_urls on" >&2
            exit 1
          fi
          headers="$(curl -fsS --retry 5 --retry-all-errors -o /dev/null -D - "$URL/")"
          csp="$(grep -ciE '^content-security-policy: .*frame-ancestors https:' <<<"$headers" || true)"
          hsts="$(grep -ci '^strict-transport-security: max-age=63072000' <<<"$headers" || true)"
          missing="$(curl -s -o /dev/null -w '%{http_code}' "$URL/deploy-check-no-such-page/")"
          # Caddy answered TRACE, TRACK and CONNECT with 405; nothing may echo a request back.
          trace="$(curl -s -o /dev/null -w '%{http_code}' -X TRACE "$URL/")"

          fail=0
          expect() {
            if [[ "$2" == "$3" ]]; then
              echo "ok: $1"
            else
              echo "FAIL: $1 (got $2, want $3)" >&2
              fail=1
            fi
          }
          expect "the site's CSP header" "$csp" 1
          expect "the HSTS header" "$hsts" 1
          expect "a missing page's status" "$missing" 404
          if [[ "$trace" == 2* ]]; then
            echo "FAIL: TRACE answered $trace" >&2
            fail=1
          else
            echo "ok: TRACE refused ($trace)"
          fi
          exit "$fail"

      - name: Deploy the version
        working-directory: ${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ matrix.site == 'www' && vars.WWW_WORKER || vars.DOCS_WORKER }}
          REF: ${{ needs.resolve.outputs.ref }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler versions deploy "$VERSION_ID@100%" --name "$WORKER" --message "$REF" --yes
