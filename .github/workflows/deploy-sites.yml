# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Sites

# Builds www and docs and deploys them to Cloudflare Workers static assets. The
# Worker names, public URLs and account come from the variables infra/cloudflare
# writes into each GitHub Environment; the API token is an Environment secret.
#
# - Publishing a release runs this with its tag: both environments get the release.
#   It is triggered by the release rather than called from release.yml, because only a
#   directly triggered job receives its Environment's secrets.
#   Each Environment has a required reviewer, so prod deploys once someone has checked
#   staging and approved.
# - Weekly, staging is rebuilt from the latest release, so its www hero picks up a
#   changed featured product or teardown. Prod is never rebuilt unattended: run this
#   by hand for prod to refresh it.
# - A manual run deploys the selected commit to one environment. Prod's Environment
#   accepts `main` and release tags only.
on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the selected commit to.
        required: true
        type: choice
        options: [staging, prod]

permissions: {}

jobs:
  resolve:
    name: Resolve ref
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      environments: ${{ steps.ref.outputs.environments }}
    steps:
      - name: Resolve ref and environments
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$TAG_NAME" ]]; then
            ref="$TAG_NAME"
          elif [[ "$EVENT" == schedule ]]; then
            ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          else
            ref="$GITHUB_SHA"
          fi
          if [[ -n "$ENVIRONMENT" ]]; then
            environments="[\"$ENVIRONMENT\"]"
          elif [[ "$EVENT" == schedule ]]; then
            environments='["staging"]'
          else
            environments='["prod","staging"]'
          fi
          {
            echo "ref=$ref"
            echo "environments=$environments"
          } >>"$GITHUB_OUTPUT"

  deploy:
    name: ${{ matrix.site }} (${{ matrix.env }})
    needs: resolve
    runs-on: ubuntu-26.04
    # Per Worker, so a release, weekly and manual deploy of the same Worker queue
    # behind each other.
    concurrency:
      group: deploy-sites-${{ matrix.env }}-${{ matrix.site }}
      cancel-in-progress: false
    timeout-minutes: 20
    environment: ${{ matrix.env }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        site: [www, docs]
        env: ${{ fromJSON(needs.resolve.outputs.environments) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Check environment
        env:
          SITE: ${{ matrix.site }}
          ENV_NAME: ${{ matrix.env }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL }}
          DOCS_PUBLIC_URL: ${{ vars.DOCS_PUBLIC_URL }}
          WORKER: ${{ matrix.site == 'www' && vars.WWW_WORKER || vars.DOCS_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          missing=()
          for name in API_PUBLIC_URL APP_PUBLIC_URL SITE_PUBLIC_URL DOCS_PUBLIC_URL; do
            [[ "${!name}" == https://* ]] || missing+=("$name (an https:// URL)")
          done
          [[ -n "$WORKER" ]] || missing+=("${SITE^^}_WORKER")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ "$HAS_TOKEN" == true ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          if ((${#missing[@]})); then
            printf 'the %s GitHub Environment is missing: %s\n' "$ENV_NAME" "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          # This job holds CLOUDFLARE_API_TOKEN; build from a clean store.
          restore-cache: "false"

      - name: Install dependencies
        run: just ${{ matrix.site }}/install

      - name: Build www
        if: matrix.site == 'www'
        working-directory: www
        env:
          PUBLIC_APP_URL: ${{ vars.APP_PUBLIC_URL }}
          PUBLIC_DOCS_URL: ${{ vars.DOCS_PUBLIC_URL }}
          PUBLIC_SITE_URL: ${{ vars.SITE_PUBLIC_URL }}
          PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL }}
          PUBLIC_FEATURED_PRODUCT_ID: ${{ vars.FEATURED_PRODUCT_ID }}
          # Fail rather than ship the fixture when the featured product is unreachable.
          LANDING_REQUIRE_LIVE: "1"
        run: pnpm run build

      - name: Build docs
        if: matrix.site == 'docs'
        working-directory: docs
        env:
          ENV_NAME: ${{ matrix.env }}
          PUBLIC_DOCS_URL: ${{ vars.DOCS_PUBLIC_URL }}
          PUBLIC_BACKEND_API_URL: ${{ vars.API_PUBLIC_URL }}
        run: pnpm run "build:$ENV_NAME"

      - name: Check the built site under workerd
        working-directory: ${{ matrix.site }}
        run: ../scripts/check_site_headers.sh

      - name: Deploy to Workers
        working-directory: ${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ matrix.site == 'www' && vars.WWW_WORKER || vars.DOCS_WORKER }}
          REF: ${{ needs.resolve.outputs.ref }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --name "$WORKER" --message "$REF"
