# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Queue, never cancel: only the run that creates a release publishes its images, so a
# push to main during that publish must not cancel it. A queued run superseded by a
# newer one is safe to drop, since release-please picks up any merged release PR it
# has not tagged yet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish-images:
    name: Publish images
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  deploy-sites:
    name: Deploy sites
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-sites.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
