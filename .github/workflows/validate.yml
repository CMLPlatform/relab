# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # NOTE: inert until the repository enables the merge queue. Wired up now so the
  # queue can be switched on without another workflow change; a merge_group run
  # behaves exactly like a push to main (full checks, all smoke legs) because the
  # event carries no PR context for path filtering.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  # Keyed by event too, so a scheduled or merge-queue run never cancels (or is
  # cancelled by) a push run that happens to share github.ref. PR and push runs
  # are still superseded by their own newer commits.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-policy: ${{ steps.decide.outputs.run-policy }}
      run-backend: ${{ steps.decide.outputs.run-backend }}
      run-www: ${{ steps.decide.outputs.run-www }}
      run-app: ${{ steps.decide.outputs.run-app }}
      run-docs: ${{ steps.decide.outputs.run-docs }}
      run-e2e: ${{ steps.decide.outputs.run-e2e }}
      smoke-legs: ${{ steps.decide.outputs.smoke-legs }}
      is-renovate-pr: ${{ steps.detect.outputs.is-renovate-pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes

      - name: Decide which CI jobs should run
        id: decide
        shell: bash
        env:
          IS_SCHEDULE: ${{ steps.detect.outputs.is-schedule }}
          IS_DISPATCH: ${{ steps.detect.outputs.is-dispatch }}
          IS_MERGE_GROUP: ${{ steps.detect.outputs.is-merge-group }}
          SHARED: ${{ steps.detect.outputs.shared }}
          POLICY: ${{ steps.detect.outputs.policy }}
          BACKEND: ${{ steps.detect.outputs.backend }}
          WWW: ${{ steps.detect.outputs.www }}
          APP: ${{ steps.detect.outputs.app }}
          DOCS: ${{ steps.detect.outputs.docs }}
          SMOKE_BACKEND: ${{ steps.detect.outputs.smoke-backend }}
          SMOKE_WWW: ${{ steps.detect.outputs.smoke-www }}
          SMOKE_APP: ${{ steps.detect.outputs.smoke-app }}
          SMOKE_DOCS: ${{ steps.detect.outputs.smoke-docs }}
          SMOKE_ORCHESTRATION: ${{ steps.detect.outputs.smoke-orchestration }}
        run: |
          ALL_LEGS='["docker-smoke-backend","docker-orchestration-smoke","docker-smoke-www","docker-smoke-app","docker-smoke-docs","docker-smoke-backups"]'

          # Scheduled runs exercise docker-smoke, plus the backend suite under a
          # rotating TEST_SEED (see the backend job) — the test factories generate
          # data from a fixed seed, so a test that leans on a generated value only
          # fails once the seed moves. Everything else is skipped.
          if [[ "$IS_SCHEDULE" == "true" ]]; then
            for k in run-policy run-www run-app run-docs run-e2e; do
              echo "$k=false" >> "$GITHUB_OUTPUT"
            done
            echo "run-backend=true" >> "$GITHUB_OUTPUT"
            echo "smoke-legs=$ALL_LEGS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual dispatch and merge-queue runs exercise everything: a merge_group
          # event has no PR context, so path filters cannot run at all.
          if [[ "$IS_DISPATCH" == "true" || "$IS_MERGE_GROUP" == "true" ]]; then
            for k in run-policy run-backend run-www run-app run-docs run-e2e; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            echo "smoke-legs=$ALL_LEGS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Path-based filtering for push/pull_request events.
          {
            echo "run-policy=$([[ "$SHARED" == "true" || "$POLICY" == "true" ]] && echo true || echo false)"
            echo "run-backend=$([[ "$SHARED" == "true" || "$BACKEND" == "true" ]] && echo true || echo false)"
            echo "run-www=$([[ "$SHARED" == "true" || "$WWW" == "true" ]] && echo true || echo false)"
            echo "run-app=$([[ "$SHARED" == "true" || "$APP" == "true" ]] && echo true || echo false)"
            echo "run-docs=$([[ "$SHARED" == "true" || "$DOCS" == "true" ]] && echo true || echo false)"
            echo "run-e2e=$([[ "$SHARED" == "true" || "$BACKEND" == "true" || "$APP" == "true" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          # Per-leg smoke selection: each ~30 min leg runs only when its own build
          # inputs moved. backend Dockerfiles feed api/migrator/backups alike, and
          # compose+deploy+ops-script changes drive both orchestration and backups.
          # NOTE: steps run under `set -e`, so use `if` rather than `[[ ... ]] && ...`,
          # whose false branch would fail the step.
          legs=()
          if [[ "$SMOKE_BACKEND" == "true" ]]; then
            legs+=(docker-smoke-backend)
          fi
          if [[ "$SMOKE_BACKEND" == "true" || "$SMOKE_ORCHESTRATION" == "true" ]]; then
            legs+=(docker-orchestration-smoke docker-smoke-backups)
          fi
          if [[ "$SMOKE_WWW" == "true" ]]; then
            legs+=(docker-smoke-www)
          fi
          if [[ "$SMOKE_APP" == "true" ]]; then
            legs+=(docker-smoke-app)
          fi
          if [[ "$SMOKE_DOCS" == "true" ]]; then
            legs+=(docker-smoke-docs)
          fi
          # Empty array renders as `[]`, which skips the docker-smoke job entirely.
          echo "smoke-legs=$(printf '%s\n' ${legs[@]+"${legs[@]}"} | jq -Rnc '[inputs | select(. != "")]')" >> "$GITHUB_OUTPUT"

  automation:
    name: Automation, IaC, and Compose Policy
    needs: [ changes ]
    if: github.event_name != 'schedule' && needs.changes.outputs.run-policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-python: "true"
          setup-node: "true"
          uv-cache-dependency-glob: |
            pyproject.toml
            uv.lock
            backend/uv.lock

      - name: Compute prek cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache prek environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/prek
          key: prek|${{ runner.os }}|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_wrapper: false

      - name: Run repository policy checks
        run: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'SKIP=no-commit-to-branch ' || '' }}uv run prek run --all-files --show-diff-on-failure

      - name: Validate Cloudflare edge IaC
        run: just cloudflare-check

      - name: Validate environment variable policy
        run: just env-policy-check

      - name: Validate Compose stacks
        run: just compose-config

      - name: Validate deploy secret paths
        run: just deploy-secrets-check

      - name: Publish summary
        run: |
          {
            echo "### Validation automation"
            echo
            echo "- repository policy checks passed"
            echo "- Cloudflare edge IaC validated"
            echo "- environment variable policy validated"
            echo "- Compose configs rendered successfully"
            echo "- deploy secret file paths matched rendered Compose"
            echo "- GitHub workflow lint passed via prek"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: [ changes ]
    if: needs.changes.outputs.run-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-python: "true"
          uv-cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: just backend/install

      - name: Run check
        run: just backend/check

      - name: Run CI test suite
        run: just backend/test-ci
        env:
          # The factories seed themselves from TEST_SEED so a run is reproducible.
          # A fixed seed freezes the remaining coin flips rather than removing
          # them, so the weekly scheduled run rotates it and surfaces any test
          # that only passes under seed 0. run_id, not $RANDOM: the seed is then
          # recorded on the run, and TEST_SEED=<id> reproduces the failure.
          TEST_SEED: ${{ github.event_name == 'schedule' && github.run_id || '0' }}

      - name: Publish reports
        uses: ./.github/actions/publish-reports
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          coverage-file: ./backend/reports/coverage/coverage.xml
          junit-file: ./backend/reports/junit.xml
          network-prefix: backend/app/
          artifact-name: validate-backend-reports
          artifact-path: |
            backend/reports/coverage/html/
            backend/reports/coverage/coverage.xml

  www:
    name: www
    needs: [ changes ]
    if: needs.changes.outputs.run-www == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: just www/install

      - name: Run check
        run: just www/check

      - name: Run CI test suite
        run: just www/test-ci

      - name: Publish reports
        uses: ./.github/actions/publish-reports
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: www
          coverage-file: ./www/coverage/lcov.info
          junit-file: ./www/junit.xml
          network-prefix: www/
          artifact-name: validate-www-coverage
          artifact-path: www/coverage/

  e2e-www:
    name: www E2E
    needs: [ changes ]
    if: github.event_name == 'workflow_dispatch' || (needs.changes.outputs.run-www == 'true' && github.event_name != 'schedule' && needs.changes.outputs.is-renovate-pr != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          cache-dependency-path: pnpm-lock.yaml
          setup-playwright: "true"

      - name: Install dependencies
        run: just www/install

      - name: Build site
        run: just www/build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ github.event_name == 'workflow_dispatch' && 'chromium firefox webkit' || 'chromium' }}
        working-directory: www

      - name: Run browser E2E tests
        run: just www/${{ github.event_name == 'workflow_dispatch' && 'test-e2e-cross-browser' || 'test-e2e' }}

      - name: Archive Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validate-www-playwright
          path: www/playwright-report/
          retention-days: 7

  app:
    name: App
    needs: [ changes ]
    if: needs.changes.outputs.run-app == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: just app/install

      - name: Run check
        run: just app/check

      - name: Run CI test suite
        run: just app/test-ci

      - name: Publish reports
        uses: ./.github/actions/publish-reports
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: app
          coverage-file: ./app/coverage/lcov.info
          junit-file: ./app/junit.xml
          network-prefix: app/
          artifact-name: validate-app-coverage
          artifact-path: app/coverage/

  docs:
    name: Docs
    needs: [ changes ]
    if: needs.changes.outputs.run-docs == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          cache-dependency-path: pnpm-lock.yaml
          setup-playwright: "true"

      - name: Install dependencies
        run: just docs/install

      - name: Run docs check
        run: just docs/check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: docs

      - name: Run docs CI test suite
        run: just docs/test-ci

  e2e-full-stack:
    name: App Full-Stack E2E
    needs: [ changes ]
    # merge_group is treated like a push to main: the queued commit gets the full pass.
    if: github.event_name == 'workflow_dispatch' || (needs.changes.outputs.run-e2e == 'true' && (github.event_name == 'push' || github.event_name == 'merge_group'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BACKEND_PORT: "18432"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          setup-node: "true"
          cache-dependency-path: pnpm-lock.yaml
          setup-playwright: "true"

      - name: Install app dependencies
        run: just app/install

      - name: Build Expo web app for local E2E backend
        run: just app/build-web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Run full-stack E2E tests
        run: just test-e2e-full-stack

      - name: Archive Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validate-app-e2e
          path: app/playwright-report/
          retention-days: 7

  docker-smoke:
    name: Docker Smoke (${{ matrix.recipe }})
    needs: [ changes ]
    # `changes` emits the leg list; `[]` means nothing container-relevant moved and
    # the whole job skips (an accepted result for validate-result).
    if: needs.changes.outputs.smoke-legs != '' && needs.changes.outputs.smoke-legs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.changes.outputs.smoke-legs) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Run smoke recipe
        uses: ./.github/actions/docker-smoke
        with:
          recipe: ${{ matrix.recipe }}

  validate-result:
    name: Validate Result
    # The `needs:` block below is the single source of blocking jobs — it is passed
    # wholesale to check-required-jobs. Skipped jobs are accepted, failed/cancelled fail.
    if: always()
    needs:
      - changes
      - automation
      - backend
      - www
      - e2e-www
      - app
      - docs
      - e2e-full-stack
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check validate jobs
        uses: ./.github/actions/check-required-jobs
        with:
          results: ${{ toJSON(needs) }}
