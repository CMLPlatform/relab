# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Scorecard lives outside ci.yml on purpose: publishing to the OpenSSF webapp
# rejects workflows with top-level `defaults` or another job holding
# `id-token: write`, both of which CI needs. Feeds the README badge.
# No push trigger: a run seconds after a merge can miss the newest PR's checks
# and report SAST and CI-Tests as partial; the weekly run sees settled data.
name: Scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
