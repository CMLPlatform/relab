# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Check Required Jobs
description: Fail when any required upstream job failed, was cancelled, or returned an unexpected result.

inputs:
  results:
    # Do not write an ${{ ... }} expression here: Actions evaluates descriptions,
    # and `needs` is not a valid context inside a composite action.
    description: The caller's `needs` context serialized as JSON via toJSON().
    required: true

runs:
  using: composite
  steps:
    - name: Check job results
      shell: bash
      env:
        RESULTS_JSON: ${{ inputs.results }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        accepted = {"success", "skipped"}
        failed = False
        # Callers hand over the whole `needs` context, so the job list has exactly one
        # home: the `needs:` block. Each value is {"result": ..., "outputs": {...}}.
        needs = json.loads(os.environ["RESULTS_JSON"])

        if not needs:
            print("No upstream jobs to check — `needs` was empty.", file=sys.stderr)
            sys.exit(1)

        for job, data in sorted(needs.items()):
            result = data["result"]
            print(f"{job}: {result}")
            if result not in accepted:
                failed = True

        sys.exit(1 if failed else 0)
        PY
