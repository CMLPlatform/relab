# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Docker Smoke
description: |
  Run an allowlisted just-defined docker smoke recipe on a fresh checkout with Buildx.
  Shared by the scheduled/dispatched docker-smoke matrix.

inputs:
  recipe:
    description: The just recipe to invoke (e.g. docker-smoke-backend).
    required: true

runs:
  using: composite
  steps:
    - name: Set up runtime
      uses: ./.github/actions/setup-runtime

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

    # compose.yaml already declares `cache_from/cache_to: type=gha` on the built
    # services, but that backend needs ACTIONS_RUNTIME_TOKEN / ACTIONS_RESULTS_URL,
    # which the runner only hands to JavaScript actions — buildx invoked from a
    # shell step (via `just`) never sees them, so the cache silently no-ops.
    # Docker's own docs point at this action for exactly that case.
    - name: Expose GitHub Actions runtime to BuildKit
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

    - name: Run smoke test
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        # Route builds through bake, whose buildx integration honours the compose
        # cache_from/cache_to entries. CI-only: local `just docker-smoke-*` runs are
        # unchanged, and no cache is exported without the runtime env above.
        COMPOSE_BAKE: "true"
      run: |
        # Name-shaped allowlist rather than an enumerated one, so adding a smoke
        # recipe needs no edit here. Anchored, and the character class refuses
        # anything but a bare recipe name, so no other just recipe can be reached.
        if [[ ! "$RECIPE" =~ ^(docker-smoke-[a-z][a-z-]*|docker-orchestration-smoke)$ ]]; then
          echo "Unsupported docker smoke recipe: $RECIPE" >&2
          exit 1
        fi
        just "$RECIPE"
