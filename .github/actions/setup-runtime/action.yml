# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Runtime
description: Install just plus optional Python/uv or Node.js + pnpm toolchains. Versions come from .tool-versions and the root packageManager field.

inputs:
  setup-python:
    description: Install uv + Python (version from .tool-versions).
    required: false
    default: "false"
  setup-node:
    description: Install pnpm + Node.js (Node version from .tool-versions, pnpm version from root packageManager).
    required: false
    default: "false"
  uv-cache-dependency-glob:
    description: Newline-delimited dependency files for uv cache keys.
    required: false
    default: ""
  cache-dependency-path:
    description: Lockfile path(s) used for pnpm cache keys.
    required: false
    default: ""
  setup-playwright:
    description: Cache the Playwright browser binaries (~/.cache/ms-playwright). Callers still run `playwright install`; on a cache hit it skips the download.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      if: inputs.setup-python == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
        cache-dependency-glob: ${{ inputs.uv-cache-dependency-glob }}

    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version-file: .tool-versions

    - name: Set up pnpm and Node.js
      if: inputs.setup-node == 'true'
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        runtime: node@24
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        install: false

    - name: Cache Playwright browsers
      if: inputs.setup-playwright == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ~/.cache/ms-playwright
        key: playwright|${{ runner.os }}|${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
