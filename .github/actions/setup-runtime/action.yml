# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Runtime
description: Install just plus optional Python/uv or Node.js + pnpm toolchains. Every version is pinned - see the table in .github/CONTRIBUTING.md.

inputs:
  setup-python:
    description: Install uv + Python (version from .tool-versions).
    required: false
    default: "false"
  setup-node:
    description: Install pnpm + Node.js (Node version from .node-version, pnpm version from the root packageManager field).
    required: false
    default: "false"
  uv-cache-dependency-glob:
    description: Newline-delimited dependency files for uv cache keys.
    required: false
    default: ""
  cache-dependency-path:
    description: Lockfile path(s) used for pnpm cache keys.
    required: false
    default: pnpm-lock.yaml
  setup-playwright:
    description: Cache the Playwright browser binaries (~/.cache/ms-playwright). Callers still run `playwright install`; on a cache hit it skips the download.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      id: versions
      shell: bash
      run: |
        {
          echo "node=$(cat .node-version)"
          echo "just=$(awk '$1 == "just" { print $2 }' .tool-versions)"
        } >> "$GITHUB_OUTPUT"

    - name: Install uv
      if: inputs.setup-python == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        version-file: .tool-versions
        enable-cache: true
        cache-dependency-glob: ${{ inputs.uv-cache-dependency-glob }}

    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version-file: .tool-versions

    # Reads the pnpm version from the root packageManager field. That version must
    # be >= 11.14.0: @pnpm/linux-x64@11.13.0 shipped without the pnpm binary, and
    # this action fails unpacking it (https://github.com/pnpm/setup/issues/29).
    - name: Set up pnpm and Node.js
      if: inputs.setup-node == 'true'
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@${{ steps.versions.outputs.node }}
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        install: false

    - name: Cache Playwright browsers
      if: inputs.setup-playwright == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ~/.cache/ms-playwright
        key: playwright|${{ runner.os }}|${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      with:
        just-version: ${{ steps.versions.outputs.just }}
