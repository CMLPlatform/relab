# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Runtime
description: Install just plus optional Python/uv or Node.js + pnpm toolchains. Every version is pinned - see the table in .github/CONTRIBUTING.md.

inputs:
  setup-python:
    description: Install uv + Python (version from .tool-versions).
    required: false
    default: "false"
  setup-node:
    description: Install pnpm + Node.js (Node version from .node-version, pnpm version from the root packageManager field).
    required: false
    default: "false"
  uv-cache-dependency-glob:
    description: Newline-delimited dependency files for uv cache keys.
    required: false
    default: ""
  setup-playwright:
    description: Cache the Playwright browser binaries (~/.cache/ms-playwright). Callers still run `playwright install`; on a cache hit it skips the download.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      id: versions
      shell: bash
      run: |
        {
          echo "node=$(cat .node-version)"
          echo "just=$(awk '$1 == "just" { print $2 }' .tool-versions)"
        } >> "$GITHUB_OUTPUT"

    - name: Install uv
      if: inputs.setup-python == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version-file: .tool-versions
        enable-cache: true
        cache-dependency-glob: ${{ inputs.uv-cache-dependency-glob }}

    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .tool-versions

    # Reads the pnpm version from the root packageManager field. That version must
    # be >= 11.14.0: @pnpm/linux-x64@11.13.0 shipped without the pnpm binary, and
    # this action fails unpacking it (https://github.com/pnpm/setup/issues/29).
    - name: Set up pnpm and Node.js
      if: inputs.setup-node == 'true'
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        runtime: node@${{ steps.versions.outputs.node }}
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        install: false

    - name: Cache Playwright browsers
      if: inputs.setup-playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright|${{ runner.os }}|${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: ${{ steps.versions.outputs.just }}
