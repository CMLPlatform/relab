# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Publish Reports
description: |
  Upload a subrepo's coverage and JUnit results to Codecov and archive the
  coverage report. Skips the Codecov uploads on pull requests from forks, where
  the token is not available.

inputs:
  token:
    description: Codecov token.
    required: true
  flags:
    description: Codecov flags, and the subrepo name used for upload/artifact names.
    required: true
  coverage-file:
    description: Coverage file path to upload.
    required: true
  junit-file:
    description: JUnit XML file path to upload.
    required: true
  network-prefix:
    description: Prefix prepended to uploaded report paths before Codecov matches files.
    required: true
  artifact-path:
    description: Path(s) to archive as a workflow artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
      with:
        files: ${{ inputs.coverage-file }}
        flags: ${{ inputs.flags }}
        name: ci-${{ inputs.flags }}-coverage
        fail_ci_if_error: false
        token: ${{ inputs.token }}
        slug: CMLPlatform/relab
        disable_search: "true"
        network_prefix: ${{ inputs.network-prefix }}

    - name: Upload test results to Codecov
      # Runs even when tests fail so Codecov can track flaky/failing tests.
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
      with:
        files: ${{ inputs.junit-file }}
        flags: ${{ inputs.flags }}
        token: ${{ inputs.token }}
        fail_ci_if_error: false
        disable_search: "true"
        slug: CMLPlatform/relab

    - name: Archive coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-${{ inputs.flags }}-coverage
        path: ${{ inputs.artifact-path }}
        retention-days: 7
