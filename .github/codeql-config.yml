name: "Relab CodeQL Config"

queries:
  - uses: security-and-quality

# Honor in-code `# lgtm[query-id]` suppression comments for verified false positives
# (advanced setup does not include these queries by default). Write one as a trailing
# comment on the line holding the flagged expression, which for a multi-line call is the
# argument line, not the line that opens the call. The `# codeql[query-id]` spelling is
# matched only when the comment starts its own line, and then covers the line below it.
# See the shared AlertSuppression.qll in github/codeql for both rules.
packs:
  python:
    - codeql/python-queries:AlertSuppression.ql
  javascript:
    - codeql/javascript-queries:AlertSuppression.ql

query-filters:
  # Ruff (F401) owns unused-import linting and, unlike this query, resolves names
  # used only inside string annotations / `cast("...")`, which ruff's TC006 rule
  # mandates repo-wide. Every alert from this query here has been a false positive.
  - exclude:
      id: py/unused-import
  # The informational cycle query flags the deliberate model-registry pattern
  # (lazy imports documented in app/core/model_registry.py). The order-sensitive
  # `py/unsafe-cyclic-import` query stays enabled.
  - exclude:
      id: py/cyclic-import

# Alembic revision files intentionally expose module-level metadata variables such as `revision`
# and `down_revision`, which trigger recurring false positives for `py/unused-global-variable`.
paths-ignore:
  - backend/alembic/**
  # Deliberately non-functional Semgrep rule fixtures: every declaration is bait for a
  # rule under test, so nothing is used and CodeQL reports each one as an unused local.
  - tests/fixtures/**
