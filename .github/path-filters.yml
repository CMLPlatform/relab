# --- docker smoke legs -------------------------------------------------------
# Per-leg splits of `containers`, so a PR only pays for the ~30 min smoke legs it
# can actually break. Each leg gates on what changes its *image build inputs or
# service wiring*, not on subrepo source.
#
# The frontend images do compile subrepo source (`COPY www/src/` + astro build in
# a root-context build), so strictly speaking the subrepo is part of the build
# context. It is still left out on purpose: a source-level build break is already
# caught by the www/app/docs jobs (check + build) and the e2e jobs, so rebuilding
# a full image on every source PR buys no extra signal for ~30 min a leg. The
# weekly scheduled run smokes all six legs regardless.

smoke-backend:
  - 'backend/Dockerfile*'
  - 'backend/.dockerignore'
  - 'backend/pyproject.toml'
  - 'backend/.python-version'
  - 'backend/uv.lock'

smoke-www:
  - 'www/Dockerfile*'
  - 'www/Caddyfile'
  - 'www/package.json'
  - '.dockerignore'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'

smoke-app:
  - 'app/Dockerfile*'
  - 'app/Caddyfile'
  - 'app/package.json'
  - '.dockerignore'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'

smoke-docs:
  - 'docs/Dockerfile*'
  - 'docs/Caddyfile'
  - 'docs/package.json'
  - '.dockerignore'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'

# Compose wiring, deploy inputs, the two ops scripts the orchestration and backup
# flows shell out to, plus the smoke harness itself: the justfile holds every
# recipe body and the composite action holds the recipe allowlist, so a change to
# either must still smoke something.
smoke-orchestration:
  - 'compose*.yml'
  - 'compose*.yaml'
  - 'deploy/**'
  - 'scripts/deploy_ops.sh'
  - 'scripts/backup_restic_ops.sh'
  - 'justfile'
  - '.github/actions/docker-smoke/**'
