packages:
  - app
  - docs
  - www

engineStrict: true
preferFrozenLockfile: true

# Mirror of the allow-ghsas list on ci.yml's dependency-review step, which holds
# the per-advisory justifications and removal conditions. Keep the two in sync.
auditConfig:
  ignoreGhsas:
    - GHSA-vcc3-ghjq-m6fr # decode-uri-component (query-string@7 pins ^0.2.2)

# Wait 3 days before accepting newly published packages, transitive ones
# included. Strict by default: resolution fails rather than fall back to a
# younger release, which also covers Renovate's lockfile maintenance. Approving
# a younger pick interactively appends it to minimumReleaseAgeExclude below;
# drop such entries before committing rather than widening the exclusions.
minimumReleaseAge: 4320
# Some registry metadata omits publish times; warn and continue in that case.
minimumReleaseAgeIgnoreMissingTime: true

# Approve only install scripts that are needed for native/runtime setup.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: false
  vue-demi: false

overrides:
  # Security pins for transitive deps whose parent pins a vulnerable version
  # exactly, so a lockfile refresh cannot lift them. Each names the parent to
  # watch. `just overrides-check` (weekly in CI) flags any the tree no longer
  # needs. Tag new security pins with their GHSA so the check covers them.
  # xcode@3 (via @expo/config-plugins) still requires uuid ^7.
  "uuid@<11.1.1": ">=11.1.1" # GHSA-w5hq-g745-h8pq
  # @scalar/json-magic <0.15.2 pins undici 7.24.4.
  "undici@>=7.0.0 <7.29.0": ">=7.29.0 <8" # GHSA-8xcm-r25x-g524 and 12 related
  # @scalar/agent-chat pins ai 6.0.33.
  "@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33": ">=4.0.33 <5" # GHSA-866g-f22w-33x8
  # Carried over from NativeWind, which the app no longer uses, but still
  # earning its place: without it the tree resolves 1.30.1, 1.32.0 and
  # 1.33.0 side by side, each with its own native binary.
  lightningcss: 1.33.0

catalog:
  "@astrojs/check": ^0.9.10
  "@axe-core/playwright": ^4.12.1
  "@biomejs/biome": ^2.5.8
  astro: 7.3.3
  "@playwright/test": ^1.62.1
  "@types/node": ^26.2.0
  tailwindcss: 4.3.3
  # 7.0 is the native compiler and drops the programmatic API `astro check`
  # loads, breaking typecheck in docs/ and www/. Renovate blocks 7.0.x only, so
  # 7.1 arrives as a PR whose docs/www typecheck says whether the API is back.
  typescript: ^6.0.3

# Expo SDK packages land in same-day waves, so the release-age gate would block
# every `expo install --fix`. Name patterns match all versions; everything
# outside the Expo family still waits out minimumReleaseAge.
minimumReleaseAgeExclude:
  - expo
  - 'expo-*'
  - '@expo/*'
  - babel-preset-expo
  - jest-expo
