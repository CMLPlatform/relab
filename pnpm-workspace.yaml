packages:
  - app
  - docs
  - www

engineStrict: true
preferFrozenLockfile: true

# Wait 3 days before accepting newly published packages.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: false
# Some registry metadata omits publish times; warn and continue in that case.
minimumReleaseAgeIgnoreMissingTime: true

# Approve only install scripts that are needed for native/runtime setup.
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  vue-demi: false

overrides:
  # Keep Monaco's DOMPurify transitive dependency on a patched release.
  monaco-editor@0.55.1>dompurify: 3.4.2
  # Patch transitive vulnerabilities in expo/metro dev tooling (GHSA advisories).
  # Scoped to the vulnerable ranges so unrelated consumers keep their major.
  "shell-quote@<1.8.4": ">=1.8.4" # GHSA-wpn peer7jw-789q-3m8p
  "ws@>=7.0.0 <7.5.11": ">=7.5.11 <8" # GHSA-96hv-2xvq-fx4p
  "uuid@<11.1.1": ">=11.1.1" # GHSA-w5hq-g745-h8pq
  "yaml@<2.8.1": ">=2.8.1" # GHSA-48c2-rrv3-qjmp
  # NativeWind v5 requires pinning lightningcss (per its install docs).
  lightningcss: 1.30.1

catalog:
  "@astrojs/check": ^0.9.9
  "@axe-core/playwright": ^4.12.1
  "@biomejs/biome": ^2.5.4
  astro: 7.0.5
  "@playwright/test": ^1.61.1
  "@tailwindcss/vite": 4.3.2
  "@types/node": ^26.1.1
  playwright: ^1.61.1
  tailwindcss: 4.3.2
  typescript: ^6.0.3

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.8'
  - '@expo/config-plugins@57.0.5'
  - '@expo/config-types@57.0.2'
  - '@expo/config@57.0.5'
  - '@expo/devtools@57.0.1'
  - '@expo/dom-webview@57.0.1'
  - '@expo/env@2.4.2'
  - '@expo/fingerprint@0.20.5'
  - '@expo/image-utils@0.11.3'
  - '@expo/inline-modules@0.1.3'
  - '@expo/json-file@11.0.1'
  - '@expo/local-build-cache-provider@57.0.4'
  - '@expo/log-box@57.0.1'
  - '@expo/metro-config@57.0.5'
  - '@expo/metro-file-map@57.0.1'
  - '@expo/osascript@2.7.1'
  - '@expo/package-manager@1.13.1'
  - '@expo/plist@0.8.1'
  - '@expo/prebuild-config@57.0.7'
  - '@expo/require-utils@57.0.3'
  - '@expo/router-server@57.0.3'
  - '@expo/schema-utils@57.0.2'
  - babel-preset-expo@57.0.3
  - expo-asset@57.0.5
