# compose.e2e.yaml (END-TO-END TESTING, used for testing the full stack in CI)
#
# Normal local entrypoint:
#  just test-e2e-full-stack
#
# Frontends are intentionally NOT included here. They are built and served
# on the host, so that Playwright runs on the host and can freely reach the
# backend service on localhost.

name: relab_e2e

services:
  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${E2E_BACKEND_PORT:-18010}:8000"
    volumes:
      # To ensure that the backend has access to user uploads (for testing upload functionality with real files)
      - user_uploads:/opt/relab/backend/data/uploads
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    env_file: ./backend/.env.test
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 6

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrations
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Ensure migrations have access to user uploads (for seeding example images)
      - user_uploads:/opt/relab/backend-migrations/data/uploads
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      # SEED_DUMMY_DATA is enabled for the migrations service in the E2E environment, to ensure that the database is seeded with realistic test data (including example images) before running tests.
      SEED_DUMMY_DATA: True
    env_file: ./backend/.env.test

  redis:
    # Inherits the image pin and server flags from the base file. No password is
    # set in this environment, which the inherited command already handles:
    # `--requirepass` is only appended when REDIS_PASSWORD is non-empty.
    extends:
      file: compose.yaml
      service: redis
    restart: "no"
    networks: [default]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      start_interval: 5s
      retries: 5

  postgres:
    # Inherits the image pin, server tuning and initdb mount from the base file
    # so they cannot drift. Only the test database name and restart policy
    # differ. Full layering (-f compose.yaml -f compose.e2e.yaml) is not usable
    # here: the base migrator sits behind the `migrations` profile, so api's
    # depends_on would resolve to nothing.
    extends:
      file: compose.yaml
      service: postgres
    env_file: ./backend/.env.test
    restart: "no"
    # extends merges networks rather than replacing them, so the inherited
    # `data` membership stays. This stack is flat, so postgres also has to join
    # `default` or api and migrator cannot reach it.
    networks: [default]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U postgres -d relab_e2e_db" ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      start_interval: 5s
      retries: 5

volumes:
  user_uploads:
  # Both come in with the extended postgres service. The stack is torn down
  # with `down -v`, so the database volume stays throwaway.
  database_data:

networks:
  data:
