# compose.logging.alloy.yaml (OPTIONAL OVERLAY — ship container stdout over OTLP)
#
# The API instruments itself and sends its own telemetry. This overlay adds a Grafana
# Alloy agent that collects two things the API cannot report on itself and forwards them
# to the same OTLP endpoint with the same token:
#
#   - the stdout of every OTHER container in the stack (postgres, redis, cloudflared,
#     the frontends, backup), as logs;
#   - host resource metrics — CPU, memory, load, disk, network, and hwmon temperatures
#     and fan speeds.
#
# It replaces the older Loki Docker-driver overlay. That approach needed a Loki push
# hostname exposed to the internet, which the monitoring stack deliberately does not
# publish because Loki has no authentication of its own, and it wrote the push
# credential into every container's HostConfig where `docker inspect` could read it.
#
# The root deploy recipes auto-include this overlay when OTEL_EXPORTER_OTLP_ENDPOINT is
# set in the host's root `.env` — the same switch that turns on the API's own exporter.
# Hosts without it ship nothing and keep `docker logs` as the only log path.

services:
  alloy:
    image: grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    restart: unless-stopped
    # Root, because reading the Docker socket needs it. Kept as small a surface as
    # possible in return: no published ports, no inbound traffic, egress network only,
    # and the socket bound read-only.
    #
    # NOTE: a read-only bind stops the FILE being modified, it does not make the Docker
    # API read-only — anything that can reach this socket can start a privileged
    # container. If Alloy's exposure ever stops being acceptable, the upgrade is a
    # docker-socket-proxy in front of it restricted to the containers endpoints, not a
    # different log agent.
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # Bound to loopback: the diagnostics UI has no auth and nothing needs to reach it
      # from another container.
      - --server.http.listen-addr=127.0.0.1:12345
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      # Alloy only reads containers belonging to this project, so it must know which
      # one it is; Compose does not inject the project name automatically.
      COMPOSE_PROJECT_NAME: relab_${ENVIRONMENT}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?alloy overlay requires OTEL_EXPORTER_OTLP_ENDPOINT}
      OTLP_AUTH_TOKEN: ${OTLP_AUTH_TOKEN:?alloy overlay requires OTLP_AUTH_TOKEN}
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # node_exporter's collectors read the host's own /proc, /sys and filesystems.
      # All read-only. Note this does give the container read access to the host
      # filesystem via /rootfs, which is the price of host disk-usage metrics from a
      # container; it is no more than a host-installed node_exporter running as root
      # already has, but it is worth knowing rather than discovering.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # cAdvisor's reads. /var/lib/docker and /dev/disk are read-only; /var/run needs
      # write access, which is why the socket mount above is the honest place to look for
      # this container's blast radius rather than this list.
      - /var/run:/var/run:rw
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # Read positions survive restarts; without this every restart re-ships whatever
      # the containers still have on disk.
      - alloy_data:/var/lib/alloy/data
    networks:
      - egress
    logging:
      # Never through itself: Alloy reporting its own failure to ship logs, by shipping
      # a log, is a loop with no exit.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy_data:
