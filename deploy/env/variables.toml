# RELab runtime secret inventory.
#
# This provider-neutral contract leaves a clean path for a later external
# manager such as Infisical to sync runtime secrets into host files.

# The full runtime secret inventory is required ∪ optional; every secret belongs to
# exactly one list. Required secrets must be non-empty in prod/staging.
[env_policy]
required_secret_files = [
  "postgres_password",
  "database_app_password",
  "database_migration_password",
  "database_backup_password",
  "redis_password",
  "auth_token_secret",
  "oauth_state_secret",
  "cache_signing_secret",
  "data_encryption_key",
  "bootstrap_superuser_password",
]

# Secrets that may legitimately be absent or empty because their feature is opt-in:
#   - smtp/microsoft-graph: EMAIL_PROVIDER selects exactly one; the other stays unfilled.
#   - restic_password: only used by the profile-gated `backups` service (off by default).
#   - google/github oauth: social login is opt-in; unset the client IDs to disable it.
optional_secret_files = [
  "smtp_password",
  "microsoft_graph_client_secret",
  "restic_password",
  "google_oauth_client_secret",
  "github_oauth_client_secret",
]

infisical_path_template = "/relab/{env}/{name}"
